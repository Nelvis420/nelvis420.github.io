<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Meet For A Drink</title>
<style>
html, body { margin: 0; padding: 0; height: 100%; background: #000; overflow: hidden; font-family: Arial, Helvetica, sans-serif; }
video { position: fixed; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #000; }
h1 { position: fixed; top: 20px; left: 0; right: 0; text-align: center; color: #fff; font-size: 28px; text-shadow: 0 2px 8px rgba(0,0,0,0.8); margin: 0; z-index: 2; }
.caption { position: fixed; bottom: 16px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 6px rgba(0,0,0,0.8); z-index: 2; margin: 0; }
.video-error { position: fixed; bottom: 44px; left: 0; right: 0; text-align: center; color: #fff; font-size: 14px; text-shadow: 0 1px 6px rgba(0,0,0,0.8); z-index: 2; margin: 0; }
</style>
</head>
<body>
<h1>Meet For A Drink</h1>
<video id="slideVideo" autoplay muted playsinline controls preload="auto" poster="slide-charlotte-poster.jpg">
<source src="slide-charlotte-video-v2.mp4" type="video/mp4">
Your browser does not support the video tag.
</video>
<p id="videoError" class="video-error" hidden>Video did not start automatically - tap the play button to start it.</p>
<p class="caption">Music: Slide by Goo Goo Dolls</p>
<script>
var video = document.getElementById("slideVideo");
video.muted = true;
function tryPlay() { var p = video.play(); if (p && p.catch) { p.catch(function () {}); } }
window.addEventListener("load", tryPlay);
document.addEventListener("touchstart", tryPlay, { passive: true });
document.addEventListener("click", tryPlay);
video.addEventListener("error", function () { document.getElementById("videoError").hidden = false; });
tryPlay();
</script>
</body>
</html>
