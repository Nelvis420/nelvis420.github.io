name: Rename Kaboom file
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  rename:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rename Kaboom file
        run: |
          test -f kaboom/kaboom-fixed-index.html
          test ! -e kaboom/index.html
          ls -l kaboom
          git mv kaboom/kaboom-fixed-index.html kaboom/index.html
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git status --short
          git commit -m "Fix Waaahaaa casing in title art, fallback portrait, and game-over text"
          git push
