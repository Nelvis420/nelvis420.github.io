evel and you ",h("strong",{children:"hold your altitude"}),", so you can cruise the clouds as long as you like, on the way up or on the way down, no hyperspace needed. On the way up, once the climb reaches the clouds, ",h("strong",{children:"hold the stick DOWN"})," to level off there instead of riding the climb to space. And watch for traffic — but only ",h("strong",{children:"one airplane at a time"}),": the guest planes take turns, each crossing the sky alone with clear empty sky between turns — an ",h("strong",{children:"airliner"})," (its colors rotate: Delta-style, JetBlue-style, then a plain white-and-red jet), then the ",h("strong",{children:"old weathered biplane"})," pouring ",h("strong",{children:"smoke"}),", then the ",h("strong",{children:"brand-new clean biplane"})," — the same Finger Racer plane in two generations, flying solo now, never together. Little ",h("strong",{children:"camera drones"})," hover and drift down low. Climb above a jet and it passes beneath you; dive and it crosses overhead. The clouds are also home to ",h("strong",{children:"all four of Finger Racer's birds"})," — the little blue bird, the crow pack, the Waaahaaa Parrot and the soaring vulture — on their own separate rotation. Birds and planes here are ",h("strong",{children:"silent"})," — this sky is for watching. And by law, ",h("strong",{children:"nothing from space ever appears in this zone"})," — no planets, no wonders, no holes. Space things live only in space."]}),V("li",{children:[h("strong",{className:"text-fuchsia-300",children:"✨ Galaxy Wonders"})," — some hyperspace jumps land you somewhere truly strange. Out there you might find: a ",h("strong",{children:"space whale"})," drifting and singing (fly close and listen for it to sing back) · a ",h("strong",{children:"treasure wreck"})," with a glowing gold cargo ring to fly through · the ",h("strong",{children:"Last Gas Station"})," — last gas for 40,000 light years · a ",h("strong",{children:"ring planet"})," whose ring
